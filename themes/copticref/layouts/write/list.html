<form id="write-controls" aria-label="Writing options">
  <p>
    <label for="write-glyph">Letter or word</label>
    <select id="write-glyph" autocomplete="off"></select>
  </p>
</form>

<div id="write-reference" aria-live="polite">
  <p id="write-reference-text" class="write-big"></p>
  <p><img id="write-reference-img" alt="" width="140" height="140"></p>
</div>

<p id="write-status" class="note" role="status">Choose a letter, then trace it.</p>
<div id="write-app" aria-live="polite">
  <canvas id="write-canvas" width="280" height="280" aria-label="Tracing canvas: draw the letter here"></canvas>
  <p>
    <button id="write-check" type="button">Check my tracing</button>
    <button id="write-clear" type="button">Clear</button>
  </p>
  <p id="write-feedback" class="note" role="status"></p>
</div>

<!-- ORDER IS LOAD-BEARING. fetch_json.js defines FetchJson, and write.js
     calls it. Same discipline as the quiz, drill, and course pages. -->
<script src="{{ "js/fetch_json.js" | relURL }}" defer></script>
<script src="{{ "js/write.js" | relURL }}" defer></script>
{{ end }}
