# NOT yet been signed off by a linguist -- the work ships as text-only Coptic
# with PARTIAL English (587/1,078 aligned segments) FOR EXPERT REVIEW, and the
# /dialects coverage badge and the expert-review packet must say so. Flipping
# back is still a one-word diff.

