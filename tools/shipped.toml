# tools/shipped.toml — which corpus works the site (and the reader vault) ship.
#
# This is the switch between "we have parsed it" and "we publish it". The
# corpus roll-out order is CLOSED (v4 §10.3) and is encoded here as data, not as
# code, so changing the shipped set is a reviewable diff and never a code change.
#
# Order matters: it is liturgical -> biblical -> patristic -> monastic, and it is
# the *tier* order, not alphabetical. Monastic (Shenoute) is deliberately LAST.
# Its clitic chains and non-standard vocabulary are the hardest text in the
# project and the wrong on-ramp for a beginner. See v4 §10.3 for the reasoning;
# do not "fix" the order by alphabetising it.
#
# `slug` must match the stem of data/dist/corpus/<slug>.json.
# `tier` is metadata for /dialects and for the coverage badge (v4 §10.2).
# `dialect` drives the Bohairic honesty rules: where Bohairic coverage is thin
# the interface must say so rather than silently substituting Sahidic.

[[work]]
slug = "bohairic_liturgy_lauds"
title = "Lauds (Common Prayers)"
tier = "liturgical"
dialect = "B"
urn = "urn:cts:copticLit:ot.liturgy.lauds"
alignment = "partial"
note = "Highest community value and lowest risk: this is what the church uses weekly."

