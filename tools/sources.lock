# tools/sources.lock — every input, pinned.
#
# A pin is not decoration. Without sha256 + bytes + snapshot, the build is not
# reproducible and "the build failed" is indistinguishable from "upstream
# changed". fetch_all.py verifies each pin and HARD-FAILS on mismatch, which
# means an upstream change surfaces as a human decision rather than a shrug.
#
# Values verified 2026-10-03 against the live upstream. See DECISIONS.md.

# ── Kaikki / Wiktextract ────────────────────────────────────────────────────
[kaikki]
url              = "https://kaikki.org/dictionary/Coptic/kaikki.org-dictionary-Coptic.jsonl"
sha256           = "7257d4f17a9380c924a000c799d7fd040f1319a1a44b9837782b7bab9cbafae6"
bytes            = 62813016
records          = 3293
snapshot         = "2026-10-03"
extraction_date  = "2026-09-28"
wiktionary_dump  = "2026-09-02"
lang_code        = "cop"
# kaikki.org describes the data as being under the same licences as Wiktionary:
# CC BY-SA 4.0 *and* GFDL. The dual option is preserved deliberately - reducing
# it silently to CC BY-SA would not be accurate. See DECISIONS.md open Q2.
licence          = "CC-BY-SA-4.0 OR GFDL"
cite             = "Ylönen, T. (2022). Wiktextract: Wiktionary as Machine-Readable Structured Data. LREC 2022, pp. 1317-1325."
role             = "SUPPLEMENT ONLY - 3,293 of ~11,500 entries. Not the dictionary backbone."
drift_gate       = "records < 2500 fails the build"

