# ── project-authored sources ─────────────────────────────────────────────────
# We wrote these, so there is no upstream url to pin. `authored = true` is what
# exempts them from Q2's url+sha256 rule, and it is deliberate: inventing an url
# would be provenance from memory (invariant 7).

[project_rebuild]
# ProjectRebuild: the project itself (merged entries, emitted artefacts).
authored    = true
licence     = "Apache-2.0"
scope       = "data/dist"
reference   = "this repository"

[translit_table]
# TranslitTable: transliteration tables, derived from CCL.
