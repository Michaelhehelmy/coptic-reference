# ── Coptic Dictionary Online ────────────────────────────────────────────────
[cdo]
# SESSION 4 Q3: CDO ships in v1 WITHOUT being ingested. There is no CDO TEI file,
# no CDO JSON, and coptic-dictionary.org serves an SPA at every /api/* path. The
# parser in tools/parse/tei.py has NO cdo dialect, because inventing one would be
# guessing at a format nobody has seen (see DECISIONS.md S3-A2). This entry stays
# because CDO is a real, allowlisted, CC BY-SA source we intend to ingest once
# there is a lawful export path. /licences/ says so publicly.
repo             = "github.com/KELLIA/dictionary"
ingested         = false
ingest_blocker   = "no export path; API returns an SPA shell"
doi              = "10.17169/refubium-2333"
licence_data      = "CC-BY-SA-4.0"
licence_code      = "Apache-2.0"
role             = "BACKBONE - URN-linked examples, corpus frequencies, MWEs"
originators      = "KELLIA alliance - ADW, BBAW, DDGLC, FU Berlin, Göttingen, Georgetown"
note             = "No top-level LICENSE file in the repo; terms are README-only. Licence recorded here and in LICENSES.csv."

