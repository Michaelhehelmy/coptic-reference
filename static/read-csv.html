<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance tables — Coptic Reference</title>
<!--
  Session 8 D5. Records and licences ship as .csv.gz (Session 7 C4), so this
  fetches and inflates via /js/fetch_json.js, which sniffs the gzip magic
  bytes so it works with or without Content-Encoding: gzip -- baseline in
  every browser this site
  targets, and no server, no runtime, no account (invariants 1-4).

  Both tables live under /licences/ because LICENSES.csv NAMES the six CC BY-NC
  sources it excludes. Invariant 5 forbids an NC id reaching public/** except on
  a disclosure page, and nc_guard_public.py enforces exactly that: shipping this
  file from /read-csv.html would fail the guard, which is what happened first.

  The raw .gz stays downloadable, because a reader who wants to sort a lexicon in
  a spreadsheet should not have to go through a web page to do it.
-->
<style>
:root { --fg:#1a1a1a; --muted:#666; --rule:#ddd; --bg:#fff; }
body { font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       color:var(--fg); background:var(--bg); margin:0; padding:2rem 1.25rem; }
h1 { font-size:1.4rem; margin:0 0 .5rem; }
.coptic { font-feature-settings:normal; }
p.lede { color:var(--muted); margin:0 0 1.25rem; max-width:60ch; }
nav a { margin-right:1rem; }
table { border-collapse:collapse; width:100%; font-size:.8rem; }
th,td { border-bottom:1px solid var(--rule); padding:.35rem .5rem;
        text-align:left; vertical-align:top; }
th { position:sticky; top:0; background:var(--bg); font-weight:600; }
td.c { font-family:"Segoe UI Historic","Noto Sans Coptic",serif; font-size:1rem; }
#status { color:var(--muted); margin:1rem 0; }
.scroll { max-height:70vh; overflow:auto; border:1px solid var(--rule); }
</style>
</head>
<body>
<h1>Provenance tables</h1>
<p class="lede">One row per (entry, source) and one row per source. Generated by
<code>tools/emit/cli.py</code> and licence-checked by
<code>tools/validate/licence_guard.py</code>. Served gzipped; decompressed in your
browser.</p>
<nav>
  <a href="#" data-src="licences/records.csv.gz">records.csv</a>
  <a href="#" data-src="licences/LICENSES.csv.gz">LICENSES.csv</a>
  <span id="dl"></span>
</nav>
<p id="status">Choose a table above.</p>
<div class="scroll"><table id="t"><thead></thead><tbody></tbody></table></div>

<!-- Shared fetch/inflate helper. Must load before the script below (Session 12 D0/C2). -->
<script src="/js/fetch_json.js"></script>

<script>
const $ = (s) => document.querySelector(s);
async function load(url) {
  const status = $("#status");
  status.textContent = "Fetching " + url + " …";
  $("#dl").innerHTML = '<a href="' + url + '" download>download raw .gz</a>';
  try {
    const text = await FetchJson.text(url);
    const rows = parseCsv(text);
    render(rows);
    status.textContent = rows.length.toLocaleString() +
      " rows — " + url;
  } catch (e) {
    // A truncated or corrupt .gz must fail VISIBLY, not render an empty table
    // that looks like "no data". Session 8 D8 negative control.
    status.innerHTML = '<strong>Could not read ' + url + ":</strong> " +
      String(e.message || e) +
      " — the file may be truncated, or not gzip.";
    $("table").querySelector("thead").innerHTML = "";
    $("table").querySelector("tbody").innerHTML = "";
  }
}
// Minimal RFC4180 parser: handles quoted fields, doubled quotes, embedded commas.
function parseCsv(text) {
  const out = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); out.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); out.push(row); }
  return out;
}
function render(rows) {
  const head = rows.shift() || [];
  const isCoptic = (h) => /lemma|norm_key/.test(h);
  $("table").querySelector("thead").innerHTML =
    "<tr>" + head.map((h) => "<th>" + esc(h) + "</th>").join("") + "</tr>";
  // Cap the render: records.csv is ~12.5k rows and the DOM should stay usable.
  const shown = rows.slice(0, 2000);
  $("table").querySelector("tbody").innerHTML = shown.map((r) =>
    "<tr>" + head.map((_, i) =>
      "<td" + (isCoptic(head[i]) ? ' class="c"' : "") + ">" + esc(r[i] || "") + "</td>"
    ).join("") + "</tr>").join("");
  if (rows.length > shown.length) {
    $("status").textContent += " — showing first " + shown.length.toLocaleString() +
      " of " + rows.length.toLocaleString() + "; download the .gz for the rest.";
  }
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
document.querySelectorAll("nav a[data-src]").forEach((a) =>
  a.addEventListener("click", (e) => { e.preventDefault(); load(a.dataset.src); }));
load("licences/records.csv.gz");
</script>
</body>
</html>
